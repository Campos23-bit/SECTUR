<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://framework-gb.cdn.gob.mx/favicon.ico" rel="shortcut icon">
    <link href="https://framework-gb.cdn.gob.mx/assets/styles/main.css" rel="stylesheet">
    <link rel="stylesheet" href="estilo.css">

    <title>SECTUR - Guía de Turistas</title>

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=UA-74639693-6"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'UA-74639693-6');
    </script>
</head>

<body>
    <main class="page page-header">
        <div class="page">
            <div class="container top-buffer-submenu vertical-buffer">

                <!-- Breadcrumb -->
                <div class="row">
                    <div class="col-sm-12">
                        <ol class="breadcrumb">
                            <li>
                                <a href="http://www.gob.mx">
                                    <i class="icon icon-home"></i>
                                </a>
                            </li>
                            <li>
                                <a href="../main.cfm">Inicio</a>
                            </li>
                            <li class="active">Consulta de guía de turista</li>
                        </ol>
                    </div>
                </div>

                <!-- Título -->
                <div class="row">
                    <div class="col-md-12">
                        <h4>Consulta de guías de turistas</h4>
                        <hr class="red">
                    </div>
                </div>

                <div class="bottom-buffer">
                    <form role="form" class="clearfix" id="frmconsultaguia" name="frmconsultaguia" accept-charset="UTF-8">

                        <input id="hidMiIdMuni" name="hidMiIdMuni" type="hidden" value="">

                        <!-- Información de la persona -->
                        <div class="row">

                            <div class="col-md-12">
                                <div class="form-group">
                                    <label for="inpNombre" class="control-label">
                                        Nombre:<span class="form-text"></span>
                                    </label>
                                    <input type="text" id="inpNombre" class="form-control" readonly>
                                </div>
                            </div>

                            <div class="col-md-12">
                                <div class="form-group">
                                    <label for="inpEstadoMunicipio">Estado, municipio:</label>
                                    <input type="text" id="inpEstadoMunicipio" class="form-control" readonly>
                                </div>
                            </div>

                            <div class="col-md-12">
                                <div class="form-group">
                                    <label for="inpIdiomas">Idiomas:</label>
                                    <input type="text" id="inpIdiomas" class="form-control" readonly>
                                </div>
                            </div>

                            <div class="col-md-12">
                                <div class="form-group">
                                    <label for="inpLugarTrabajo" class="control-label">
                                        Lugar de trabajo:
                                    </label>
                                    <input type="text" id="inpLugarTrabajo" class="form-control" readonly>
                                </div>
                            </div>

                        </div>

                        <!-- Mapa -->
                        <div class="row mt-4">
                            <div class="col-md-12">
                                <div id="mapa"></div>
                            </div>
                        </div>

                    </form>

                    <!-- Tabla de credenciales -->
                    <div class="contenedor-tabla">
                        <table class="tabla-guias">
                            <thead>
                                <tr>
                                    <th>Credencial</th>
                                    <th>Expedición</th>
                                    <th>Vigencia</th>
                                    <th>Tipo guía</th>
                                    <th>Especialización</th>
                                    <th>Sub tema</th>
                                    <th>Aventura</th>
                                    <th>Nivel</th>
                                </tr>
                            </thead>
                            <tbody id="tablaGuias">
                                <!-- consultaguia.js inserta aquí los datos -->
                            </tbody>
                        </table>
                    </div>

                </div>

                <!-- Área de carga -->
                <div class="row" style="padding-left: 15px; padding-right: 15px;">
                    <hr>
                    <div class="col-md-12" id="listaconsultaguia">
                        <div class="row">
                            <div class="col-md-5"></div>
                            <div class="col-md-1">
                                <div id="wait" style="display:none;width:69px;height:89px;position:inline;top:100%;left:50%;padding:1px;">
                                    <img src="../image/loading.gif" width="60" height="60" alt="Cargando">
                                    <br>Cargando....
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Botones -->
                <div class="text-right" style="margin: 40px 0 60px 0; clear: both;">
                    <button id="btnRegresar" name="btnRegresar" class="btn btn-default" type="button" onclick="window.location.href='../main.cfm'">
                        Regresar
                    </button>
                    <button id="btnContactar" name="btnContactar" class="btn btn-primary" type="button" onclick="window.location.href='../main.cfm'">
                        Contactar
                    </button>
                </div>

            </div>
        </div>
    </main>

    <!-- JS de Gobierno -->
    <script src="https://framework-gb.cdn.gob.mx/gobmx.js"></script>

    <!-- Tu JS con la información dinámica -->
    <script src="consultaguia.js"></script>

    <!-- Google Maps -->
    <!-- Sustituye TU_API_KEY por tu clave de Google Maps -->
    <script async src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCH-OcYzVIwJXKq_n50sE3BkhwOba-aKNs&callback=initMap"></script>
</body>
</html>
